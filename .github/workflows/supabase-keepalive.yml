name: Supabase keep-alive

# Supabase pausa los proyectos del plan Free tras 7 dias sin actividad.
# Este workflow escribe una fila en la base todos los dias para evitarlo.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta el secret SUPABASE_DB_URL"
            exit 1
          fi
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          # Supabase ya no cuenta las lecturas como actividad: hay que escribir.
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists keepalive;
          create table if not exists keepalive.pings (
            id bigserial primary key,
            pinged_at timestamptz not null default now()
          );
          insert into keepalive.pings default values;
          delete from keepalive.pings where pinged_at < now() - interval '30 days';
          SQL

      # GitHub desactiva los workflows programados tras 60 dias sin actividad en el repo.
      # Re-habilitar el workflow desde la API reinicia ese contador.
      - name: Mantener activo el workflow programado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
